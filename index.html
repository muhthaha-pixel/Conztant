<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="color-scheme" content="light dark">
  <title>Conztant Fuel Ledger</title>
  <meta name="description" content="Petrol pump management — daily duty readings, tank stock, credit, expenses, salary and monthly P&L.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%23005423' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3E%3Cpath d='M5 21V6a2 2 0 0 1 2-2h6a2 2 0 0 1 2 2v15'/%3E%3Cpath d='M5 12h10'/%3E%3Cpath d='M15 8h2.5L20 10.5V18a1.5 1.5 0 0 1-3 0v-3h-2'/%3E%3Cpath d='M3 21h14'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;700;800&family=Source+Sans+3:wght@400;500;600&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>

<div class="app" id="app">
  <header class="top">
    <div class="brand">
      <div class="mark"><svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 21V6a2 2 0 0 1 2-2h6a2 2 0 0 1 2 2v15"/><path d="M5 12h10"/><path d="M15 8h2.5L20 10.5V18a1.5 1.5 0 0 1-3 0v-3h-2"/><path d="M3 21h14"/></svg></div>
      <div>
        <div class="name" id="stationNameLbl">Conztant Fuel Ledger</div>
        <div class="sub">Daily readings · stock · P&amp;L</div>
      </div>
    </div>
    <div class="top-right">
      <span id="userChip"></span>
      <span class="today-chip" id="todayChip">–</span>
    </div>
  </header>

  <nav class="tabs" id="tabs"></nav>

  <div id="views"></div>

  <footer class="note">Gross P&amp;L = sales + closing stock − opening stock − purchases. Net P&amp;L = gross P&amp;L + other income − expenses.</footer>
</div>

<div id="modalRoot"></div>

<!-- Firebase (compat build — exposes the doc/collection API the app uses) -->
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
<!-- SheetJS — builds the Excel export in the browser -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="js/firebase-config.js"></script>
<script src="js/app.js"></script>
</body>
</html>
